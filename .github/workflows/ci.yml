# Main CI — runs on every push to main: build, unit tests, lint, then
# publishes the debug APK plus test/lint reports as artifacts.
#
# Action versions below are pinned to full semver tags verified on 2026-10-21
# via the GitHub Releases API.

name: CI

on:
  push:
    branches: [main]
  # Manual trigger: used when the push-event pipeline is degraded and for
  # ad-hoc re-validation. Same job, same gates as a push run.
  workflow_dispatch:

concurrency:
  group: ci-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          api-level: 37
          build-tools: 37.0.0

      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: "9.8.0"

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle lintDebug --stacktrace

      - name: Validate release build with R8 (dummy signing)
        # Phase 6: R8 (minify + resource shrinking) is enabled for the
        # release build type. The REAL release gate
        # (.github/workflows/release.yml) still fails loudly until the
        # release signing secrets are configured — that behavior is
        # intentionally untouched. This step ONLY proves the full R8
        # pipeline (ProGuard rules, resource shrinking) passes end to
        # end, by signing with the committed DEBUG keystore (same
        # credentials as the debug signingConfig in app/build.gradle.kts).
        # The resulting APK is a CI validation artifact, never a release.
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/debug.keystore
          ANDROID_KEYSTORE_PASSWORD: byokai-debug
          ANDROID_KEY_ALIAS: byokai-debug
          ANDROID_KEY_PASSWORD: byokai-debug
        run: gradle assembleRelease --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: byokai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload R8-validated release APK
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: byokai-release-r8-validation-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 30
