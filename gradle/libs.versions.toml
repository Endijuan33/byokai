# BYOKAI dependency version catalog.
#
# Every version below was verified against an authoritative source on 2026-10-21:
# - AndroidX / Google artifacts: https://dl.google.com/dl/android/maven2/.../maven-metadata.xml
# - Maven Central artifacts:    https://repo1.maven.org/maven2/.../maven-metadata.xml
# - Toolchain (AGP 9.4.1, Kotlin 2.4.21, Gradle 9.8.0, JDK 17, compile/targetSdk 37):
#   verified against developer.android.com and kotlinlang.org release notes.
#
# Only stable releases are used. No alpha / beta / RC / snapshot dependencies.
# Hilt and Room are intentionally ABSENT: KSP has no 2.4.x release for Kotlin 2.4.21
# (latest KSP on Maven Central is 2.3.12), so annotation processing for them cannot run.
# See docs/ROADMAP.md for the plan to reintroduce them once KSP supports Kotlin 2.4.x.

[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycleRuntimeCompose = "2.11.0"
lifecycleViewmodelCompose = "2.11.0"
navigationCompose = "2.10.2"
# Reserved for Phase 3+ (provider adapters, encrypted credential storage).
serializationJson = "1.12.0"
okhttp = "5.5.0"
tinkAndroid = "1.24.0"
datastorePreferences = "1.2.1"
junit = "4.13.2"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
# Phase 3+ libraries (catalogued now, wired into modules when their phase starts).
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tinkAndroid" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
